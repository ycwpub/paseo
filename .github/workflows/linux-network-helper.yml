name: Debian network helper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-network-helper.yml"
      - "packages/desktop/native/network-helper/linux/**"
      - "packages/desktop/scripts/build-linux-network-helper.mjs"
      - "packages/desktop/scripts/test-linux-network-helper.sh"
      - "packages/desktop/scripts/linux-network-helper-after-install.sh"
      - "packages/desktop/electron-builder.yml"
      - "packages/desktop/package.json"
      - "packages/server/src/server/project-call-permissions/**"
      - "packages/server/src/utils/project-network-process*"
  push:
    branches:
      - feature_paseo
      - "ci/linux-network-helper-*"
    paths:
      - ".github/workflows/linux-network-helper.yml"
      - "packages/desktop/native/network-helper/linux/**"
      - "packages/desktop/scripts/build-linux-network-helper.mjs"
      - "packages/desktop/scripts/test-linux-network-helper.sh"
      - "packages/desktop/scripts/linux-network-helper-after-install.sh"
      - "packages/desktop/electron-builder.yml"
      - "packages/desktop/package.json"
      - "packages/server/src/server/project-call-permissions/**"
      - "packages/server/src/utils/project-network-process*"

permissions:
  contents: read

jobs:
  escape-tests:
    name: Debian 12 namespace, proxy, and package tests
    runs-on: ubuntu-22.04
    container:
      image: debian:12
      options: --privileged
    timeout-minutes: 40
    steps:
      - name: Prepare Debian test environment
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            fakeroot \
            git \
            iproute2 \
            iptables \
            pkg-config \
            procps \
            python3 \
            rpm \
            sudo \
            tar \
            unzip \
            xz-utils
          useradd --create-home --shell /bin/bash paseo
          echo 'paseo ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/paseo

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert Debian runtime
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = "debian"
          test "$VERSION_ID" = "12"
          echo "Testing on $PRETTY_NAME"

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/npm-ci.log"
          node scripts/npm-retry.mjs ci >"$log_file" 2>&1
          status=$?
          cat "$log_file"
          if (( status != 0 )); then
            diagnostic="$(
              tail -120 "$log_file" |
                sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
                awk '{printf "%s%%0A", $0}'
            )"
            echo "::error title=Debian npm ci failed::$diagnostic"
          fi
          exit "$status"

      - name: Build Protocol declarations
        run: npm run build:protocol

      - name: Prepare non-root execution user
        run: chown -R paseo:paseo "$GITHUB_WORKSPACE"

      - name: Compile helper and run process-tree escape tests
        shell: bash
        run: |
          set +e
          log_file="$RUNNER_TEMP/linux-network-helper.log"
          sudo -H -u paseo env PATH="$PATH" \
            npm run test:linux-network-helper --workspace=@getpaseo/desktop \
            >"$log_file" 2>&1
          status=$?
          cat "$log_file"
          {
            echo "## Linux network helper output"
            echo '```text'
            tail -200 "$log_file"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          if (( status != 0 )); then
            diagnostic="$(
              tail -80 "$log_file" |
                sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
                awk '{printf "%s%%0A", $0}'
            )"
            echo "::error title=Linux network helper escape test failed::$diagnostic"
          fi
          exit "$status"

      - name: Run Project policy and proxy integration
        shell: bash
        env:
          PASEO_LINUX_NETWORK_HELPER_TEST_PATH: ${{ github.workspace }}/packages/desktop/native-build/linux/x64/paseo-network-helper
          PASEO_LINUX_NETWORK_TARGET_ADDRESS: 11.0.0.2
        run: |
          sudo ip address add 11.0.0.2/32 dev lo
          echo '127.0.0.1 paseo-rebind.test' | sudo tee -a /etc/hosts
          sudo -H -u paseo env \
            PATH="$PATH" \
            PASEO_LINUX_NETWORK_HELPER_TEST_PATH="$PASEO_LINUX_NETWORK_HELPER_TEST_PATH" \
            PASEO_LINUX_NETWORK_TARGET_ADDRESS="$PASEO_LINUX_NETWORK_TARGET_ADDRESS" \
            npx vitest run \
              packages/server/src/server/project-call-permissions/linux-project-network-isolation.local.e2e.test.ts \
              --bail=1

      - name: Build Linux desktop packages
        shell: bash
        env:
          EP_GH_IGNORE_TIME: "true"
        run: |
          set +e
          log_file="$RUNNER_TEMP/linux-desktop-packages.log"
          sudo -H -u paseo env PATH="$PATH" EP_GH_IGNORE_TIME=true \
            npm run build:desktop -- --publish never --linux deb rpm --x64 \
            >"$log_file" 2>&1
          status=$?
          cat "$log_file"
          if (( status != 0 )); then
            diagnostic="$(
              tail -120 "$log_file" |
                sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
                awk '{printf "%s%%0A", $0}'
            )"
            echo "::error title=Linux desktop package build failed::$diagnostic"
          fi
          exit "$status"

      - name: Install and upgrade deb package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find packages/desktop/release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          package_name="$(dpkg-deb -f "$deb" Package)"
          sudo dpkg -i "$deb"
          test "$(stat -c '%U:%G:%a' /opt/Paseo/resources/network-helper/paseo-network-helper)" = \
            "root:root:4755"
          sudo dpkg -i "$deb"
          test "$(stat -c '%U:%G:%a' /opt/Paseo/resources/network-helper/paseo-network-helper)" = \
            "root:root:4755"
          sudo dpkg -r "$package_name"

      - name: Install and upgrade rpm package
        shell: bash
        run: |
          set -euo pipefail
          rpm_file="$(find packages/desktop/release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          package_name="$(rpm -qp --queryformat '%{NAME}' "$rpm_file")"
          sudo rpm -i --nodeps "$rpm_file"
          test "$(stat -c '%U:%G:%a' /opt/Paseo/resources/network-helper/paseo-network-helper)" = \
            "root:root:4755"
          sudo rpm -U --replacepkgs --nodeps "$rpm_file"
          test "$(stat -c '%U:%G:%a' /opt/Paseo/resources/network-helper/paseo-network-helper)" = \
            "root:root:4755"
          sudo rpm -e "$package_name"
