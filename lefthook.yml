pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint -- {staged_files}
    - name: typecheck
      run: npm run typecheck
    - name: upstream-file-budget
      run: node scripts/check-upstream-file-budget.mjs --cached
    - name: no-source-overlays
      run: node scripts/check-source-overlays.mjs --cached
